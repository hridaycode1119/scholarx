<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ScholarX — Faculty & Administrator Portal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400;1,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <script>
    window.addEventListener('error', function(e) {
      console.error('Captured Error:', e);
      var el = document.createElement('div');
      el.style = 'background:#fee2e2;color:#991b1b;border:2px solid #ef4444;padding:20px;margin:20px;border-radius:12px;font-family:monospace;white-space:pre-wrap;z-index:99999;position:relative;';
      el.innerHTML = '<strong>Runtime Error:</strong>\n' + (e.error ? (e.error.stack || e.error.message) : e.message);
      document.body.appendChild(el);
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Unhandled Rejection:', e);
      var el = document.createElement('div');
      el.style = 'background:#fee2e2;color:#991b1b;border:2px solid #ef4444;padding:20px;margin:20px;border-radius:12px;font-family:monospace;white-space:pre-wrap;z-index:99999;position:relative;';
      el.innerHTML = '<strong>Bootstrap Rejection:</strong>\n' + (e.reason ? (e.reason.stack || e.reason.message) : e.reason);
      document.body.appendChild(el);
    });
  </script>
</head>
<body class="bg-[#FCFCFB] min-h-screen text-[#0B4A39]">
  <app-root></app-root>
</body>
</html>
